[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "etl-datos-chile"
version = "0.1.0"
description = "Pipeline ETL incremental de sismos (USGS) e indicadores económicos de Chile hacia un modelo estrella en PostgreSQL."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sebastián Muñoz" }]
requires-python = ">=3.12"
keywords = ["etl", "data engineering", "postgresql", "chile", "sismos", "data warehouse"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "pydantic>=2.7",
    "psycopg[binary]>=3.2",
    "typer>=0.15",
    "rich>=13.7",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.46", "pandas>=2.2", "altair>=5"]

[project.scripts]
etl-chile = "etl_chile.cli:app"

[project.urls]
Repository = "https://github.com/sebakine/etl-datos-chile"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/etl_chile"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=etl_chile --cov-report=term-missing"
testpaths = ["tests"]
markers = ["integracion: necesita PostgreSQL (variable TEST_DATABASE_URL)"]

[tool.coverage.run]
branch = true
source = ["etl_chile"]

[tool.coverage.report]
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PT", "C4", "S", "DTZ"]
ignore = ["PLR0913", "PLR2004", "PLC0415", "RUF001", "RUF002", "RUF003", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "S105", "DTZ001"]
"dashboard/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
